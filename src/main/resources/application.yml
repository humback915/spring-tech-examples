server:
  port: 8080

spring:
  application:
    name: spring-tech-examples

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    # ── Hibernate 고유 속성 ──
    # spring.jpa.hibernate.* 는 ddl-auto, naming 등 Spring Boot 전용 속성만 인식
    # Hibernate 고유 속성(batch_size 등)은 반드시 spring.jpa.properties.hibernate.* 에 설정
    # 잘못된 경로에 넣으면 설정이 무시됨 (에러 없이 기본값 사용)
    properties:
      hibernate:
        # ── Hibernate 배치 설정 ──
        jdbc:
          # Hibernate가 INSERT/UPDATE를 JDBC 배치로 묶어 실행
          # 개별 SQL을 하나씩 보내는 대신 N개를 한 번에 전송 → DB 라운드트립 감소
          # 권장값: 50~500 (너무 크면 메모리 사용 증가)
          batch_size: 100
          # @Version 엔티티의 UPDATE도 배치 가능하게 설정
          # false면 @Version 엔티티는 개별 UPDATE 실행 (배치 비효율)
          batch_versioned_data: true
        # 같은 테이블의 INSERT를 연속 배치로 묶음
        # false면 A-INSERT, B-INSERT, A-INSERT 순서 시 배치가 깨짐
        order_inserts: true
        # 같은 테이블의 UPDATE를 연속 배치로 묶음
        order_updates: true

  # ── Spring Batch 설정 ──
  batch:
    # 앱 시작 시 배치 Job 자동 실행 여부
    # true: 앱 기동과 동시에 등록된 모든 Job 실행 (개발/테스트용)
    # false: 수동 트리거 또는 스케줄러에서 실행 (운영 환경 권장)
    job:
      enabled: false
    jdbc:
      # Spring Batch 메타데이터 테이블 자동 생성
      # ALWAYS: 항상 생성 (개발용, H2 등 인메모리 DB)
      # NEVER: 생성 안 함 (운영 - Flyway/Liquibase로 관리)
      # EMBEDDED: 임베디드 DB일 때만 자동 생성
      initialize-schema: always
      # 메타데이터 테이블 접두사 (여러 배치 앱이 같은 DB 사용 시 분리)
      # 기본값: BATCH_
      table-prefix: BATCH_

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      connect-timeout: 2000
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: 1000

  # ── Spring Kafka 설정 (yml로 가능한 항목) ──
  # 아래 속성들은 Spring Boot 자동 구성이 ProducerFactory, ConsumerFactory,
  # KafkaTemplate을 생성할 때 사용한다.
  # 커스텀 로직(에러 핸들러, DLT 라우팅 등)은 yml로 불가 → KafkaConfig.java에서 @Bean 정의
  kafka:
    # Kafka 브로커 주소 (클러스터: host1:9092,host2:9092,host3:9092)
    bootstrap-servers: localhost:9092
    consumer:
      # Consumer Group ID — 같은 그룹의 Consumer끼리 파티션 분담
      group-id: example-group
      # 오프셋 초기화 정책 (earliest: 처음부터, latest: 최신부터)
      auto-offset-reset: earliest
      # poll() 한 번에 가져올 최대 레코드 수 (배치 크기 조절)
      max-poll-records: 10
      # 메시지 키/값 역직렬화 — 문자열 기본
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # acks: 메시지 수신 확인 수준
      #   0: 확인 안 함 (가장 빠름, 유실 가능)
      #   1: Leader만 확인 (기본)
      #   all(-1): 모든 ISR 확인 (가장 안전, 권장)
      acks: all
      # 전송 실패 시 자동 재시도 횟수
      retries: 3
      # 메시지 압축 방식 (none, gzip, snappy, lz4, zstd)
      # lz4: 빠른 압축/해제, 적당한 압축률 — 실시간 처리에 적합
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Spring Boot가 매핑하지 않는 Kafka 네이티브 속성은 properties.* 하위에 설정
      properties:
        # 멱등성 프로듀서 — 네트워크 재전송으로 인한 중복 메시지 방지
        enable.idempotence: true
        # 멱등성 활성 시 최대 5까지 허용 (순서 보장 + 성능 균형)
        max.in.flight.requests.per.connection: 5
    listener:
      # Consumer 스레드 수 — 파티션 수 이하로 설정
      # 파티션 3개인 토픽이면 concurrency: 3 으로 설정하여 병렬 소비
      concurrency: 1

# Custom
executor:
  refund:
    core-pool-size: 10
    max-pool-size: 15
    queue-capacity: 200

# ========================================================================
# Nginx SSL/TLS 종료 레퍼런스 — 인증서, 프로토콜, HSTS, 성능 튜닝
# ========================================================================
#
# ── 핵심 개념 ──
#
# SSL 종료(SSL Termination)란 Nginx에서 HTTPS 암호화를 해제하고,
# 백엔드(Spring Boot)로는 평문 HTTP로 전달하는 구조.
# 백엔드는 암호화 부담 없이 비즈니스 로직에만 집중할 수 있다.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │  SSL 종료 흐름                                                       │
# │                                                                      │
# │  클라이언트                                                          │
# │    │                                                                 │
# │    │ HTTPS (TLS 1.3, 암호화)                                         │
# │    ↓                                                                 │
# │  ┌─────────────────────┐                                             │
# │  │  Nginx (443)        │  ← SSL 종료 지점                            │
# │  │  - 인증서 관리      │                                             │
# │  │  - TLS 핸드셰이크   │                                             │
# │  │  - 암호화/복호화    │                                             │
# │  └────────┬────────────┘                                             │
# │           │                                                          │
# │           │ HTTP (평문, 내부 네트워크)                                │
# │           ↓                                                          │
# │  ┌─────────────────────┐                                             │
# │  │  Spring Boot (8080) │  ← 암호화 부담 없음                         │
# │  │  - 비즈니스 로직    │                                             │
# │  └─────────────────────┘                                             │
# └──────────────────────────────────────────────────────────────────────┘
#
# ── SSL 종료의 장점 ──
#
# ┌──────────────────┬───────────────────────────────────────────────────┐
# │ 장점             │ 설명                                              │
# ├──────────────────┼───────────────────────────────────────────────────┤
# │ 중앙 집중 관리   │ 인증서를 Nginx에서만 관리 (각 앱에 배포 불필요)   │
# │ 성능             │ 앱 서버의 CPU를 비즈니스 로직에 집중              │
# │ 인증서 갱신      │ Let's Encrypt + certbot으로 자동 갱신             │
# │ 프로토콜 통일    │ 내부 통신은 HTTP로 단순화                        │
# │ 디버깅 용이      │ 내부 트래픽을 평문으로 캡처 가능                  │
# └──────────────────┴───────────────────────────────────────────────────┘
#
# ── TLS 버전 비교 ──
#
# ┌──────────┬──────────────────┬──────────┬────────────────────────────┐
# │ 버전     │ 핸드셰이크       │ 보안     │ 상태                       │
# ├──────────┼──────────────────┼──────────┼────────────────────────────┤
# │ TLS 1.0  │ 2 RTT            │ 취약     │ 사용 금지 (RFC 8996)       │
# │ TLS 1.1  │ 2 RTT            │ 취약     │ 사용 금지 (RFC 8996)       │
# │ TLS 1.2  │ 2 RTT            │ 안전     │ 호환성 유지용              │
# │ TLS 1.3  │ 1 RTT (0-RTT)    │ 매우안전 │ 권장 (2018~)               │
# └──────────┴──────────────────┴──────────┴────────────────────────────┘
#
# ========================================================================

# ================================================================
# [1] HTTP → HTTPS 리다이렉트
# ================================================================
#
# 모든 HTTP 요청을 HTTPS로 301 영구 리다이렉트.
# 검색 엔진이 HTTPS URL을 정규 URL로 인식한다.

server {
    listen 80;
    server_name example.com www.example.com;

    # ACME challenge (Let's Encrypt 인증서 발급/갱신)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ================================================================
# [2] HTTPS 서버 블록 — SSL 설정
# ================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # ────────────────────────────────────────────────────────────
    # [2-1] 인증서 경로
    # ────────────────────────────────────────────────────────────
    #
    # ┌──────────────────────┬────────────────────────────────────┐
    # │ 파일                 │ 설명                               │
    # ├──────────────────────┼────────────────────────────────────┤
    # │ ssl_certificate      │ 서버 인증서 + 중간 인증서 체인     │
    # │ ssl_certificate_key  │ 개인 키 (권한: 600, root만 읽기)   │
    # │ ssl_trusted_certificate │ OCSP 스테이플링용 CA 인증서     │
    # └──────────────────────┴────────────────────────────────────┘

    # Let's Encrypt 인증서 경로 (certbot 기본)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # OCSP 스테이플링용 CA 인증서
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    # ────────────────────────────────────────────────────────────
    # [2-2] 프로토콜 및 암호화 스위트
    # ────────────────────────────────────────────────────────────
    #
    # TLSv1.2와 TLSv1.3만 허용.
    # TLS 1.3은 서버 측 cipher 설정이 불필요 (프로토콜에 내장).

    ssl_protocols TLSv1.2 TLSv1.3;

    # TLS 1.2 암호화 스위트 — ECDHE(전방향 보안) + AES-GCM(AEAD) 우선
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # 서버 측 cipher 순서 우선 (클라이언트가 약한 cipher 선택 방지)
    ssl_prefer_server_ciphers on;

    # DH 파라미터 (TLS 1.2 DHE 키 교환용)
    # 생성: openssl dhparam -out /etc/nginx/dhparam.pem 2048
    ssl_dhparam /etc/nginx/dhparam.pem;

    # ────────────────────────────────────────────────────────────
    # [2-3] 성능 튜닝 — 세션 캐시, OCSP 스테이플링
    # ────────────────────────────────────────────────────────────
    #
    # ┌──────────────────────────────────────────────────────────────┐
    # │  TLS 핸드셰이크 최적화                                       │
    # │                                                              │
    # │  Full Handshake (첫 연결):                                   │
    # │  Client ──→ ClientHello ──→ Server                           │
    # │  Client ←── ServerHello + Cert ←── Server                    │
    # │  Client ──→ KeyExchange ──→ Server                           │
    # │  (1-2 RTT)                                                   │
    # │                                                              │
    # │  Resumed Handshake (세션 캐시 사용):                          │
    # │  Client ──→ ClientHello + SessionID ──→ Server               │
    # │  Client ←── ServerHello (캐시 히트) ←── Server               │
    # │  (0-1 RTT — 핸드셰이크 비용 대폭 절감)                       │
    # └──────────────────────────────────────────────────────────────┘

    # 세션 캐시: shared 메모리에 저장 (1MB ≈ 4000 세션)
    ssl_session_cache shared:SSL:10m;

    # 세션 유효 시간 (기본 5분 → 4시간으로 확장)
    ssl_session_timeout 4h;

    # 세션 티켓 비활성화 (전방향 보안 유지를 위해 권장)
    # TLS 1.3에서는 세션 티켓 대신 PSK 사용
    ssl_session_tickets off;

    # OCSP 스테이플링 — 인증서 유효성을 Nginx가 미리 확인하여 클라이언트에 전달
    # (클라이언트가 직접 CA에 문의할 필요 없음 → 연결 속도 향상)
    ssl_stapling on;
    ssl_stapling_verify on;

    # OCSP 응답 확인용 DNS 리졸버
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ────────────────────────────────────────────────────────────
    # [2-4] HSTS (HTTP Strict Transport Security)
    # ────────────────────────────────────────────────────────────
    #
    # 브라우저에게 이 도메인은 반드시 HTTPS로만 접속하라고 지시.
    # max-age 동안 HTTP 접속 시도 자체를 HTTPS로 변환 (301 리다이렉트 없이).
    #
    # ┌──────────────────────────────────────────────────────────────┐
    # │  HSTS 동작 흐름                                              │
    # │                                                              │
    # │  1회차: http://example.com → 301 → https://example.com      │
    # │         응답 헤더: Strict-Transport-Security: max-age=...    │
    # │                                                              │
    # │  2회차~: http://example.com                                  │
    # │         → 브라우저가 내부적으로 https로 변환 (307 Internal)   │
    # │         → 네트워크 요청 전에 이미 HTTPS로 전환               │
    # │                                                              │
    # │  includeSubDomains: 서브도메인도 HTTPS 강제                  │
    # │  preload: HSTS Preload List 등록 (브라우저 내장)             │
    # └──────────────────────────────────────────────────────────────┘
    #
    # 주의: HSTS를 설정하면 max-age 동안 HTTP로 접속 불가능.
    #       처음에는 짧은 max-age(300)로 테스트 후 점진적으로 늘릴 것.

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ────────────────────────────────────────────────────────────
    # [2-5] 리버스 프록시 설정
    # ────────────────────────────────────────────────────────────

    upstream spring_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    location /api/ {
        proxy_pass http://spring_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # HTTPS → HTTP 변환을 Spring이 인식하도록 프로토콜 전달
        # Spring Boot: server.forward-headers-strategy=native 설정 필요
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# ================================================================
# [3] Let's Encrypt 자동 갱신 (certbot)
# ================================================================
#
# ── 초기 인증서 발급 ──
#
# certbot certonly --webroot \
#     -w /var/www/certbot \
#     -d example.com \
#     -d www.example.com
#
# ── 자동 갱신 (cron 또는 systemd timer) ──
#
# # /etc/cron.d/certbot (매일 2회 갱신 시도)
# 0 0,12 * * * root certbot renew --quiet --post-hook "nginx -s reload"
#
# ── 갱신 흐름 ──
#
# ┌──────────────────────────────────────────────────────────────┐
# │  certbot renew                                               │
# │    ↓                                                         │
# │  /.well-known/acme-challenge/ 에 토큰 파일 생성              │
# │    ↓                                                         │
# │  Let's Encrypt CA가 HTTP로 토큰 검증                         │
# │    ↓                                                         │
# │  새 인증서 발급 → /etc/letsencrypt/live/ 에 저장             │
# │    ↓                                                         │
# │  --post-hook으로 nginx reload (무중단 적용)                  │
# └──────────────────────────────────────────────────────────────┘

# ================================================================
# [4] SSL 설정 검증 명령어
# ================================================================
#
# # 설정 문법 검사
# nginx -t
#
# # SSL 인증서 만료일 확인
# openssl x509 -noout -dates -in /etc/letsencrypt/live/example.com/fullchain.pem
#
# # TLS 연결 테스트
# openssl s_client -connect example.com:443 -servername example.com
#
# # SSL Labs 등급 확인 (온라인)
# # https://www.ssllabs.com/ssltest/

# ========================================================================
# Nginx 기본 설정 레퍼런스 — 리버스 프록시, 정적 파일, Gzip, 타임아웃
# ========================================================================
#
# ── 핵심 개념 ──
#
# Nginx는 Event-driven, Non-blocking 아키텍처의 고성능 웹 서버이자 리버스 프록시.
# master 프로세스가 설정을 관리하고, worker 프로세스가 실제 요청을 처리한다.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  Nginx 프로세스 구조                                                │
# ├─────────────────────────────────────────────────────────────────────┤
# │                                                                     │
# │  master process (root)                                              │
# │    ├─ 설정 파일 로드                                                │
# │    ├─ worker 프로세스 관리 (fork)                                   │
# │    └─ 시그널 처리 (reload, stop)                                    │
# │                                                                     │
# │  worker process 1  ←─ Event Loop (epoll/kqueue)                     │
# │  worker process 2  ←─ 수천 개 동시 커넥션 처리                      │
# │  worker process N  ←─ Non-blocking I/O                              │
# │                                                                     │
# └─────────────────────────────────────────────────────────────────────┘
#
# ── Nginx vs Apache vs 내장 Tomcat 비교 ──
#
# ┌──────────────────┬───────────────────┬───────────────────┬──────────────────┐
# │ 항목             │ Nginx             │ Apache            │ 내장 Tomcat      │
# ├──────────────────┼───────────────────┼───────────────────┼──────────────────┤
# │ 아키텍처         │ Event-driven      │ Process/Thread    │ Thread Pool      │
# │ 동시 접속        │ 수만 연결         │ 수천 연결         │ 수백 연결        │
# │ 메모리 효율      │ 매우 높음         │ 보통              │ 보통             │
# │ 정적 파일        │ 매우 빠름         │ 보통              │ 느림             │
# │ 리버스 프록시     │ 네이티브 지원     │ mod_proxy         │ 미지원           │
# │ SSL 종료         │ 네이티브 지원     │ mod_ssl           │ 가능하나 비권장  │
# │ 주 용도          │ 리버스 프록시     │ 범용 웹 서버      │ Java 앱 서빙    │
# │ 설정 리로드      │ 무중단 (reload)   │ graceful restart  │ 앱 재시작 필요   │
# └──────────────────┴───────────────────┴───────────────────┴──────────────────┘
#
# ── 블록 구조 ──
#
#   nginx.conf
#   ├── events { }          ← worker 커넥션 수, 이벤트 모델
#   ├── http { }            ← HTTP 설정 (로그, gzip, upstream 등)
#   │   ├── server { }      ← 가상 호스트 (도메인/포트별)
#   │   │   └── location { } ← URI 경로별 처리 규칙
#   │   └── server { }
#   └── stream { }          ← TCP/UDP 프록시 (L4)
#
# ── 요청 처리 흐름 ──
#
#   클라이언트 → Nginx (80/443)
#                  ↓
#            server 블록 매칭 (server_name)
#                  ↓
#            location 블록 매칭 (URI)
#                  ↓
#            ┌─────────────┬──────────────┐
#            │ proxy_pass  │ root/alias   │
#            │ (리버스     │ (정적 파일   │
#            │  프록시)    │  서빙)       │
#            └─────────────┴──────────────┘
#
# ========================================================================

# ================================================================
# [1] 기본 설정 — worker, 이벤트, 로그
# ================================================================

# worker 프로세스 수 — auto는 CPU 코어 수와 동일하게 설정
worker_processes auto;

# 에러 로그 경로 및 레벨
error_log /var/log/nginx/error.log warn;

# PID 파일 경로
pid /run/nginx.pid;

events {
    # worker당 최대 동시 커넥션 수
    # 총 동시 처리량 = worker_processes × worker_connections
    worker_connections 1024;

    # Linux에서 epoll 사용 (이벤트 기반 I/O 다중화)
    use epoll;

    # 한 번에 여러 커넥션 수락 허용
    multi_accept on;
}

# ================================================================
# [2] HTTP 블록 — 공통 설정
# ================================================================

http {

    # MIME 타입 설정
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ────────────────────────────────────────────────────────────
    # [2-1] JSON 액세스 로그 포맷
    # ────────────────────────────────────────────────────────────
    # 구조화된 로그로 ELK, Datadog 등에서 파싱 용이
    #
    # ┌──────────────────────────────────────────────────────────┐
    # │  JSON 로그 예시                                          │
    # │  {                                                       │
    # │    "time": "2024-01-15T10:30:00+09:00",                 │
    # │    "remote_addr": "192.168.1.100",                      │
    # │    "method": "POST",                                    │
    # │    "uri": "/api/orders",                                │
    # │    "status": 201,                                       │
    # │    "body_bytes_sent": 256,                              │
    # │    "request_time": 0.045,                               │
    # │    "upstream_response_time": 0.042                      │
    # │  }                                                       │
    # └──────────────────────────────────────────────────────────┘

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ────────────────────────────────────────────────────────────
    # [2-2] 성능 최적화 — sendfile, TCP 설정
    # ────────────────────────────────────────────────────────────

    # sendfile: 커널 공간에서 직접 파일 전송 (사용자 공간 복사 없음)
    sendfile on;

    # tcp_nopush: sendfile과 함께 사용, 헤더와 데이터를 한 패킷에 전송
    tcp_nopush on;

    # tcp_nodelay: 작은 패킷도 즉시 전송 (Nagle 알고리즘 비활성화)
    tcp_nodelay on;

    # Keep-Alive 타임아웃 (초)
    keepalive_timeout 65;

    # 해시 테이블 최적화 (server_name이 많을 때)
    types_hash_max_size 2048;

    # ────────────────────────────────────────────────────────────
    # [2-3] Gzip 압축
    # ────────────────────────────────────────────────────────────
    #
    # ┌──────────────────┬───────────────────────────────────────┐
    # │ 설정             │ 설명                                  │
    # ├──────────────────┼───────────────────────────────────────┤
    # │ gzip on          │ 압축 활성화                           │
    # │ gzip_min_length  │ 이 크기 이하는 압축 안 함 (오버헤드)  │
    # │ gzip_comp_level  │ 1(빠름/낮은 압축) ~ 9(느림/높은 압축) │
    # │ gzip_types       │ 압축 대상 MIME 타입                   │
    # │ gzip_vary        │ Vary: Accept-Encoding 헤더 추가       │
    # │ gzip_proxied     │ 프록시 응답도 압축                    │
    # └──────────────────┴───────────────────────────────────────┘

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # 이미 압축된 파일(.gz)이 있으면 재압축 없이 사용
    gzip_static on;

    # ────────────────────────────────────────────────────────────
    # [2-4] 타임아웃 및 요청 크기 제한
    # ────────────────────────────────────────────────────────────
    #
    # ┌──────────────────────┬──────┬──────────────────────────────────────┐
    # │ 설정                 │ 기본 │ 설명                                 │
    # ├──────────────────────┼──────┼──────────────────────────────────────┤
    # │ client_max_body_size │ 1m   │ 요청 본문 최대 크기 (파일 업로드)    │
    # │ client_body_timeout  │ 60s  │ 클라이언트 본문 읽기 타임아웃        │
    # │ send_timeout         │ 60s  │ 응답 전송 타임아웃                   │
    # │ proxy_connect_timeout│ 60s  │ 업스트림 연결 타임아웃               │
    # │ proxy_read_timeout   │ 60s  │ 업스트림 응답 읽기 타임아웃          │
    # │ proxy_send_timeout   │ 60s  │ 업스트림으로 요청 전송 타임아웃      │
    # └──────────────────────┴──────┴──────────────────────────────────────┘

    # 파일 업로드 최대 100MB (Spring의 spring.servlet.multipart.max-file-size와 일치시킬 것)
    client_max_body_size 100m;

    client_body_timeout   30s;
    send_timeout          30s;

    # ================================================================
    # [3] 리버스 프록시 — Spring Boot 앱으로 요청 전달
    # ================================================================
    #
    # ┌──────────────────────────────────────────────────────────────┐
    # │  리버스 프록시 흐름                                          │
    # │                                                              │
    # │  클라이언트 ──→ Nginx (80/443) ──→ Spring Boot (8080)        │
    # │              (공개)            (proxy_pass)   (내부)          │
    # │                                                              │
    # │  역할:                                                       │
    # │  - SSL 종료 (HTTPS → HTTP 변환)                              │
    # │  - 로드밸런싱 (여러 Spring Boot 인스턴스)                    │
    # │  - 정적 파일 직접 서빙                                       │
    # │  - 요청/응답 버퍼링                                          │
    # │  - 보안 헤더 추가                                            │
    # └──────────────────────────────────────────────────────────────┘

    # upstream 정의 (단일 인스턴스 예시)
    upstream spring_app {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name example.com;

        # ────────────────────────────────────────────────────────
        # [3-1] API 요청 → Spring Boot 프록시
        # ────────────────────────────────────────────────────────
        #
        # proxy_set_header로 원본 클라이언트 정보를 전달해야
        # Spring Boot에서 실제 클라이언트 IP를 알 수 있다.
        #
        # ┌────────────────────┬─────────────────────────────────┐
        # │ 헤더               │ 용도                            │
        # ├────────────────────┼─────────────────────────────────┤
        # │ Host               │ 원본 호스트명 유지              │
        # │ X-Real-IP          │ 클라이언트 실제 IP              │
        # │ X-Forwarded-For    │ 프록시 체인 IP 목록             │
        # │ X-Forwarded-Proto  │ 원본 프로토콜 (http/https)      │
        # │ X-Request-ID       │ 요청 추적 ID (MDC 연동)         │
        # └────────────────────┴─────────────────────────────────┘

        location /api/ {
            proxy_pass http://spring_app;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            # 프록시 타임아웃
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    30s;

            # 버퍼링 — 업스트림 응답을 Nginx가 먼저 받아 클라이언트에 전달
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ────────────────────────────────────────────────────────
        # [3-2] 정적 파일 서빙
        # ────────────────────────────────────────────────────────
        #
        # Nginx가 직접 서빙 → Spring Boot 부하 감소
        # 브라우저 캐시 활용으로 네트워크 트래픽 절감
        #
        # ┌──────────────────────────────────────────────────────┐
        # │  location 매칭 우선순위                               │
        # │                                                      │
        # │  1. =   /exact      ← 정확히 일치 (최우선)           │
        # │  2. ^~  /prefix     ← 접두사 일치 (정규식보다 우선)  │
        # │  3. ~   \.php$      ← 정규식 대소문자 구분           │
        # │  4. ~*  \.(jpg|png) ← 정규식 대소문자 무시           │
        # │  5.     /prefix     ← 일반 접두사 (최후순위)         │
        # └──────────────────────────────────────────────────────┘

        location /static/ {
            root /var/www;
            # /static/image.png → /var/www/static/image.png

            # try_files: 파일 존재 확인 → 없으면 404
            try_files $uri $uri/ =404;

            # 브라우저 캐시 30일 (Cache-Control: max-age=2592000)
            expires 30d;

            # ETag 활성화 (조건부 요청 지원)
            etag on;

            # 액세스 로그 비활성화 (정적 파일은 로그 불필요)
            access_log off;
        }

        # 이미지/폰트 전용 캐시 설정
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2|woff|ttf)$ {
            root /var/www/static;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ────────────────────────────────────────────────────────
        # [3-3] SPA (React/Vue) 라우팅 지원
        # ────────────────────────────────────────────────────────
        #
        # SPA는 클라이언트 사이드 라우팅을 사용하므로
        # 모든 경로에서 index.html을 반환해야 한다.

        location / {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;
        }

        # ────────────────────────────────────────────────────────
        # [3-4] 헬스체크 엔드포인트
        # ────────────────────────────────────────────────────────

        location /health {
            proxy_pass http://spring_app/actuator/health;

            # 헬스체크 로그 제외
            access_log off;
        }

        # ────────────────────────────────────────────────────────
        # [3-5] 에러 페이지 커스터마이징
        # ────────────────────────────────────────────────────────

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}

# ========================================================================
# Nginx 로드밸런싱 레퍼런스 — upstream, 전략 5종, 헬스체크, 배포 패턴
# ========================================================================
#
# ── 핵심 개념 ──
#
# upstream 블록은 여러 백엔드 서버를 그룹으로 정의하고,
# 로드밸런싱 알고리즘에 따라 요청을 분배한다.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │  로드밸런싱 흐름                                                     │
# │                                                                      │
# │  클라이언트 ──→ Nginx (LB)                                           │
# │                   │                                                  │
# │          ┌────────┼────────┐                                         │
# │          ↓        ↓        ↓                                         │
# │     App:8080  App:8081  App:8082                                     │
# │     (Spring)  (Spring)  (Spring)                                     │
# │                                                                      │
# │  모든 인스턴스는 동일 코드 + 설정                                    │
# │  세션 공유: Redis Session 또는 JWT (Stateless)                       │
# └──────────────────────────────────────────────────────────────────────┘
#
# ── 로드밸런싱 전략 비교 ──
#
# ┌──────────────┬──────────────────────┬────────────┬────────────────────────────┐
# │ 전략         │ 분배 방식            │ 설정       │ 적합한 경우                │
# ├──────────────┼──────────────────────┼────────────┼────────────────────────────┤
# │ round-robin  │ 순차적 분배 (기본)   │ 없음       │ 서버 스펙이 동일한 경우    │
# │ least_conn   │ 활성 연결 수가 적은  │ least_conn │ 요청 처리 시간 편차 클 때  │
# │              │ 서버에 우선 분배     │            │                            │
# │ ip_hash      │ 클라이언트 IP 해시   │ ip_hash    │ 세션 기반 인증 (Sticky)    │
# │ hash         │ 지정 키 해시         │ hash $key  │ 캐시 서버, 파티셔닝        │
# │ random       │ 랜덤 분배           │ random     │ 대규모 분산 환경           │
# └──────────────┴──────────────────────┴────────────┴────────────────────────────┘
#
# ── server 파라미터 ──
#
# ┌──────────────────┬─────────────────────────────────────────────┐
# │ 파라미터         │ 설명                                        │
# ├──────────────────┼─────────────────────────────────────────────┤
# │ weight=N         │ 가중치 (기본 1, 높을수록 많은 요청 수신)    │
# │ max_fails=N      │ 이 횟수만큼 실패하면 비활성 (기본 1)        │
# │ fail_timeout=Ns  │ 비활성 유지 시간 + 실패 카운트 윈도우       │
# │ backup           │ 다른 서버 모두 실패 시에만 사용             │
# │ down             │ 비활성 (유지보수 시 사용)                   │
# │ max_conns=N      │ 최대 동시 연결 수 제한                     │
# └──────────────────┴─────────────────────────────────────────────┘
#
# ========================================================================

# ================================================================
# [1] Round-Robin (기본) — 순차적 분배
# ================================================================
#
# 별도 설정 없이 server만 나열하면 round-robin으로 동작한다.
# weight로 가중치를 부여하면 가중 라운드로빈이 된다.

upstream spring_app_rr {
    # 가중 라운드로빈: app1에 3배 많은 요청 전달
    server 10.0.1.10:8080 weight=3;   # 고성능 서버 (3/6 = 50%)
    server 10.0.1.11:8080 weight=2;   # 중간 서버   (2/6 ≈ 33%)
    server 10.0.1.12:8080 weight=1;   # 저사양 서버 (1/6 ≈ 17%)

    # Keep-Alive 연결 유지 — 업스트림 재연결 오버헤드 제거
    keepalive 32;
}

# ================================================================
# [2] Least Connections — 활성 연결 수 기반 분배
# ================================================================
#
# 처리 시간이 들쭉날쭉한 경우에 적합.
# 현재 활성 연결이 가장 적은 서버에 요청을 보낸다.
#
# ┌──────────────────────────────────────────────────────┐
# │  현재 상태:                                          │
# │  app1: 활성 12개  ← 바쁨                             │
# │  app2: 활성  3개  ← 여유 → 새 요청은 여기로          │
# │  app3: 활성  7개                                     │
# └──────────────────────────────────────────────────────┘

upstream spring_app_lc {
    least_conn;

    server 10.0.1.10:8080;
    server 10.0.1.11:8080;
    server 10.0.1.12:8080;

    keepalive 32;
}

# ================================================================
# [3] IP Hash — 클라이언트 IP 기반 고정 분배 (Sticky Session)
# ================================================================
#
# 동일 클라이언트 IP → 항상 같은 서버로 라우팅.
# 세션 기반 인증 시 세션 데이터를 서버 간 공유하지 않아도 된다.
#
# 주의사항:
# - L4 로드밸런서(AWS NLB 등) 뒤에서는 모든 요청이 같은 IP로 보일 수 있음
# - 서버 추가/제거 시 IP 매핑이 변경됨
# - Redis Session 또는 JWT(Stateless)가 더 권장됨

upstream spring_app_iphash {
    ip_hash;

    server 10.0.1.10:8080;
    server 10.0.1.11:8080;
    server 10.0.1.12:8080;
    # down 표시한 서버는 해시 링에서 자리를 유지 (다른 서버 매핑 변경 방지)
    # server 10.0.1.13:8080 down;
}

# ================================================================
# [4] Hash — 사용자 정의 키 기반 분배
# ================================================================
#
# 특정 요청 속성(URI, 쿠키, 헤더 등)을 키로 해시하여 분배.
# consistent 옵션: 서버 추가/제거 시 최소한의 키만 재배치 (Consistent Hashing)

upstream spring_app_hash {
    # URI 기반 해시 — 같은 URI는 항상 같은 서버 (캐시 효율 극대화)
    hash $request_uri consistent;

    server 10.0.1.10:8080;
    server 10.0.1.11:8080;
    server 10.0.1.12:8080;
}

# ================================================================
# [5] Random — 랜덤 분배
# ================================================================
#
# two 옵션: 2개 서버를 랜덤 선택 후 least_conn 기준으로 최종 선택
# (Power of Two Random Choices 알고리즘)

upstream spring_app_random {
    random two least_conn;

    server 10.0.1.10:8080;
    server 10.0.1.11:8080;
    server 10.0.1.12:8080;
}

# ================================================================
# [6] 헬스체크 — 패시브 헬스체크
# ================================================================
#
# Nginx 오픈소스는 패시브 헬스체크만 지원.
# (Nginx Plus는 액티브 헬스체크 지원)
#
# ┌──────────────────────────────────────────────────────────────┐
# │  패시브 헬스체크 흐름                                        │
# │                                                              │
# │  요청 → app1 실패 (502/503/timeout)                          │
# │    → fail_count++ (max_fails까지 카운트)                     │
# │    → max_fails 도달 → fail_timeout 동안 비활성               │
# │    → fail_timeout 경과 → 다시 요청 전달 시도                 │
# │    → 성공 시 활성 복구                                       │
# └──────────────────────────────────────────────────────────────┘
#
# ┌──────────────────┬──────────────────────────────────────────┐
# │ 설정             │ 의미                                     │
# ├──────────────────┼──────────────────────────────────────────┤
# │ max_fails=3      │ 3회 연속 실패 시 비활성화                │
# │ fail_timeout=30s │ 30초간 비활성 유지 + 실패 카운트 윈도우  │
# └──────────────────┴──────────────────────────────────────────┘

upstream spring_app_health {
    least_conn;

    server 10.0.1.10:8080 max_fails=3 fail_timeout=30s;
    server 10.0.1.11:8080 max_fails=3 fail_timeout=30s;
    server 10.0.1.12:8080 max_fails=3 fail_timeout=30s;

    # 백업 서버 — 위 3대 모두 실패 시에만 활성화
    server 10.0.1.99:8080 backup;

    keepalive 32;
}

# ================================================================
# [7] Sticky Session — ip_hash vs Cookie (Nginx Plus)
# ================================================================
#
# ┌──────────────────┬──────────────────────┬───────────────────────┐
# │ 방식             │ ip_hash              │ sticky cookie         │
# ├──────────────────┼──────────────────────┼───────────────────────┤
# │ 지원             │ 오픈소스             │ Nginx Plus 전용       │
# │ 기준             │ 클라이언트 IP        │ 쿠키 값               │
# │ L4 LB 뒤         │ 동작 안 함 (같은 IP) │ 정상 동작             │
# │ 서버 변경 시      │ 매핑 변경           │ 쿠키 유지             │
# │ 권장 대안         │ Redis Session / JWT  │                      │
# └──────────────────┴──────────────────────┴───────────────────────┘
#
# Nginx Plus sticky cookie 예시 (참고용):
# upstream backend {
#     sticky cookie srv_id expires=1h domain=.example.com path=/;
#     server 10.0.1.10:8080;
#     server 10.0.1.11:8080;
# }

# ================================================================
# [8] Blue-Green / Canary 배포 패턴
# ================================================================
#
# ── Blue-Green 배포 ──
#
# ┌──────────────────────────────────────────────────────────────┐
# │  배포 전: 100% → Blue (현재 버전)                            │
# │  배포 후: upstream 변경 → 100% → Green (새 버전)             │
# │  롤백:   upstream 변경 → 100% → Blue (이전 버전)             │
# │                                                              │
# │  Nginx reload만으로 전환 가능 (무중단)                       │
# └──────────────────────────────────────────────────────────────┘

upstream blue {
    server 10.0.1.10:8080;
    server 10.0.1.11:8080;
}

upstream green {
    server 10.0.1.20:8080;
    server 10.0.1.21:8080;
}

# 현재 활성 환경을 변수로 관리
# 배포 시 blue → green으로 변경 후 nginx -s reload
# map $host $active_backend {
#     default blue;    # ← green으로 변경하여 전환
# }

# ── Canary 배포 (가중치 기반) ──
#
# ┌──────────────────────────────────────────────────────────────┐
# │  전체 트래픽의 일부만 새 버전으로 전달                        │
# │                                                              │
# │  95% → 현재 버전 (stable)                                    │
# │   5% → 새 버전 (canary)                                     │
# │                                                              │
# │  모니터링 후 문제 없으면 canary 비율 점진적 증가              │
# └──────────────────────────────────────────────────────────────┘

upstream canary_app {
    server 10.0.1.10:8080 weight=95;   # stable (v1)
    server 10.0.1.20:8080 weight=5;    # canary (v2)
}

# ================================================================
# [9] server 블록 예시 — upstream 연동
# ================================================================

server {
    listen 80;
    server_name example.com;

    location /api/ {
        proxy_pass http://spring_app_health;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # upstream keepalive 사용 시 필수
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 실패 시 다음 서버로 재시도
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}

# ========================================================================
# Nginx WebSocket 프록시 레퍼런스 — Upgrade, STOMP, SockJS 폴백
# ========================================================================
#
# ── 핵심 개념 ──
#
# WebSocket은 HTTP 프로토콜을 Upgrade하여 양방향 통신 채널을 여는 방식.
# Nginx가 리버스 프록시일 때, WebSocket 핸드셰이크 헤더를 올바르게
# 백엔드(Spring Boot)로 전달해야 연결이 성립된다.
#
# ── WebSocket Upgrade 흐름 ──
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │                                                                      │
# │  클라이언트                    Nginx                  Spring Boot    │
# │     │                           │                         │          │
# │     │─── GET /ws/notifications ─→│                        │          │
# │     │    Upgrade: websocket     │                         │          │
# │     │    Connection: Upgrade    │                         │          │
# │     │                           │── GET /ws/notifications→│          │
# │     │                           │   Upgrade: websocket    │          │
# │     │                           │   Connection: Upgrade   │          │
# │     │                           │                         │          │
# │     │                           │←── 101 Switching ───────│          │
# │     │←── 101 Switching ─────────│    Protocols            │          │
# │     │    Protocols              │                         │          │
# │     │                           │                         │          │
# │     │←════════════ WebSocket 양방향 통신 ════════════════→│          │
# │     │    (STOMP 프레임)         │   (TCP 터널링)          │          │
# │                                                                      │
# └──────────────────────────────────────────────────────────────────────┘
#
# ── 필수 전달 헤더 ──
#
# ┌─────────────────────┬──────────────────────────────────────────────┐
# │ 헤더/설정           │ 설명                                         │
# ├─────────────────────┼──────────────────────────────────────────────┤
# │ Upgrade             │ websocket (프로토콜 전환 요청)               │
# │ Connection          │ upgrade (Hop-by-hop → Nginx가 직접 설정)    │
# │ proxy_http_version  │ 1.1 (WebSocket은 HTTP/1.1 필수)             │
# │ proxy_read_timeout  │ 기본 60s → 유휴 연결 유지를 위해 증가       │
# └─────────────────────┴──────────────────────────────────────────────┘
#
# ── SockJS 폴백 ──
#
# WebSocket을 지원하지 않는 환경(프록시, 구형 브라우저)에서
# SockJS가 자동으로 폴백 전송 방식을 사용한다.
#
# ┌──────────────────────────────────────────────────────────────┐
# │  SockJS 폴백 순서                                            │
# │                                                              │
# │  1. WebSocket     ← 가장 빠름, 양방향                       │
# │  2. XHR Streaming ← 서버→클라이언트 스트리밍                 │
# │  3. XHR Polling   ← 주기적 HTTP 요청 (최후 수단)            │
# │                                                              │
# │  SockJS URL 패턴:                                            │
# │  /ws/notifications/info            ← 서버 정보 조회         │
# │  /ws/notifications/{session}/xhr   ← XHR 폴백               │
# │  /ws/notifications/{session}/...   ← 기타 전송 방식          │
# └──────────────────────────────────────────────────────────────┘
#
# ========================================================================

# ================================================================
# [1] WebSocket 프록시를 위한 map 설정
# ================================================================
#
# HTTP/1.0 요청에는 Upgrade 헤더가 없으므로,
# $http_upgrade 변수 유무에 따라 Connection 헤더 값을 분기한다.
#
# ┌─────────────────┬───────────────────┬───────────────────┐
# │ 요청 유형       │ $http_upgrade     │ $connection_upgrade│
# ├─────────────────┼───────────────────┼───────────────────┤
# │ WebSocket       │ "websocket"       │ "upgrade"         │
# │ 일반 HTTP       │ "" (빈 문자열)    │ "" (빈 문자열)    │
# └─────────────────┴───────────────────┴───────────────────┘

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream spring_websocket {
    server 127.0.0.1:8080;

    # WebSocket 연결 유지를 위한 Keep-Alive
    keepalive 32;
}

# ================================================================
# [2] 서버 블록 — WebSocket + API 통합 프록시
# ================================================================

server {
    listen 80;
    server_name example.com;

    # ────────────────────────────────────────────────────────────
    # [2-1] WebSocket 엔드포인트 프록시
    # ────────────────────────────────────────────────────────────
    #
    # 기존 프로젝트의 WebSocketConfig.java에서 설정한 엔드포인트:
    #   registry.addEndpoint("/ws/notifications").withSockJS()
    #
    # SockJS를 사용하므로 /ws/notifications/ 하위 모든 경로를 프록시해야 한다.
    # (info, xhr, websocket 등 SockJS 내부 경로 포함)

    location /ws/ {
        proxy_pass http://spring_websocket;

        # ── WebSocket 필수 헤더 ──
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ── 원본 클라이언트 정보 전달 ──
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 타임아웃 설정 ──
        #
        # proxy_read_timeout: 백엔드가 데이터를 보내지 않아도 연결을 유지하는 시간.
        # WebSocket은 유휴 시간이 길 수 있으므로 충분히 늘려야 한다.
        #
        # ┌──────────────────────────────────────────────────────┐
        # │  타임아웃과 Ping/Pong 관계                           │
        # │                                                      │
        # │  proxy_read_timeout=3600s (1시간)                    │
        # │    → 1시간 동안 데이터 없으면 연결 종료              │
        # │                                                      │
        # │  STOMP heartbeat (Spring 설정):                      │
        # │    setHeartbeatTime(10000, 10000)                    │
        # │    → 10초마다 Ping/Pong → 타임아웃 리셋              │
        # │    → 실질적으로 연결이 끊기지 않음                   │
        # │                                                      │
        # │  proxy_read_timeout은 heartbeat 간격보다             │
        # │  충분히 크게 설정해야 한다.                           │
        # └──────────────────────────────────────────────────────┘

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # ── 버퍼링 비활성화 ──
        # WebSocket은 스트리밍이므로 버퍼링하면 메시지 지연 발생
        proxy_buffering off;

        # TCP_NODELAY — 작은 프레임도 즉시 전송
        proxy_set_header Connection $connection_upgrade;
    }

    # ────────────────────────────────────────────────────────────
    # [2-2] STOMP 전용 엔드포인트 예시
    # ────────────────────────────────────────────────────────────
    #
    # STOMP 프로토콜은 WebSocket 위에서 동작하는 메시징 프로토콜.
    # Nginx 입장에서는 일반 WebSocket과 동일하게 처리한다.
    #
    # ┌──────────────────────────────────────────────────────────┐
    # │  STOMP 메시지 흐름 (Nginx 관점)                          │
    # │                                                          │
    # │  클라이언트 STOMP 프레임:                                │
    # │  ┌──────────────────────┐                                │
    # │  │ SUBSCRIBE            │                                │
    # │  │ destination:/topic/  │  → Nginx는 그대로 전달         │
    # │  │ notifications        │    (WebSocket 프레임 페이로드)  │
    # │  └──────────────────────┘                                │
    # │                                                          │
    # │  서버 STOMP 프레임:                                      │
    # │  ┌──────────────────────┐                                │
    # │  │ MESSAGE              │                                │
    # │  │ destination:/topic/  │  ← Nginx는 그대로 전달         │
    # │  │ notifications        │                                │
    # │  │                      │                                │
    # │  │ {"message":"알림"}   │                                │
    # │  └──────────────────────┘                                │
    # └──────────────────────────────────────────────────────────┘

    # ────────────────────────────────────────────────────────────
    # [2-3] 일반 API 프록시
    # ────────────────────────────────────────────────────────────
    #
    # WebSocket이 아닌 일반 HTTP API는 별도 location으로 분리.

    location /api/ {
        proxy_pass http://spring_websocket;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ================================================================
# [3] 다중 WebSocket 엔드포인트 예시
# ================================================================
#
# 여러 WebSocket 서비스가 있는 경우 각각 location을 분리하여
# 서로 다른 upstream으로 라우팅할 수 있다.

# upstream chat_service {
#     server 10.0.1.10:8081;
# }
#
# upstream notification_service {
#     server 10.0.1.20:8082;
# }
#
# server {
#     listen 80;
#     server_name example.com;
#
#     # 채팅 WebSocket
#     location /ws/chat/ {
#         proxy_pass http://chat_service;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade    $http_upgrade;
#         proxy_set_header Connection $connection_upgrade;
#         proxy_read_timeout 3600s;
#     }
#
#     # 알림 WebSocket
#     location /ws/notifications/ {
#         proxy_pass http://notification_service;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade    $http_upgrade;
#         proxy_set_header Connection $connection_upgrade;
#         proxy_read_timeout 3600s;
#     }
# }

# ================================================================
# [4] 트러블슈팅 체크리스트
# ================================================================
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  WebSocket 연결 실패 시 확인 사항                                │
# ├─────┬────────────────────────────────────────────────────────────┤
# │  1  │ proxy_http_version 1.1 설정 여부                          │
# │  2  │ Upgrade / Connection 헤더 전달 여부                       │
# │  3  │ proxy_read_timeout이 heartbeat 간격보다 긴지              │
# │  4  │ SockJS 사용 시 /ws/ 하위 전체 경로 프록시 여부            │
# │  5  │ upstream keepalive 설정 시 Connection "" 설정 여부        │
# │  6  │ L4 로드밸런서(AWS NLB 등) WebSocket 지원 확인             │
# │  7  │ Spring Boot의 allowedOrigins에 Nginx 도메인 포함 여부     │
# │  8  │ 브라우저 개발자 도구 Network → WS 탭에서 101 응답 확인    │
# └─────┴────────────────────────────────────────────────────────────┘

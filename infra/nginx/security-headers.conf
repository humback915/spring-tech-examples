# ========================================================================
# Nginx 보안 설정 레퍼런스 — 보안 헤더, CORS, Rate Limiting, IP 제한
# ========================================================================
#
# ── 핵심 개념 ──
#
# 웹 애플리케이션 보안은 애플리케이션 레벨(Spring Security)과
# 인프라 레벨(Nginx)의 다중 방어(Defense in Depth)가 필요하다.
# Nginx에서 1차 방어선을 구축하면 불필요한 트래픽이 앱에 도달하지 않는다.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │  다중 방어 계층                                                      │
# │                                                                      │
# │  클라이언트                                                          │
# │    ↓                                                                 │
# │  [L1] Nginx — Rate Limit, IP 차단, 보안 헤더, CORS                  │
# │    ↓                                                                 │
# │  [L2] Spring Security — 인증, 인가, CSRF, XSS 필터                  │
# │    ↓                                                                 │
# │  [L3] Application — 입력 검증, 비즈니스 규칙                         │
# │    ↓                                                                 │
# │  [L4] Database — 최소 권한, 파라미터 바인딩                          │
# └──────────────────────────────────────────────────────────────────────┘
#
# ── 보안 헤더 요약 ──
#
# ┌────────────────────────────┬───────────────────────────────────────────┐
# │ 헤더                       │ 방어 대상                                 │
# ├────────────────────────────┼───────────────────────────────────────────┤
# │ X-Content-Type-Options     │ MIME 스니핑 공격                          │
# │ X-Frame-Options            │ 클릭재킹 (iframe 삽입)                    │
# │ X-XSS-Protection           │ 반사형 XSS (레거시 브라우저)              │
# │ Content-Security-Policy    │ XSS, 데이터 삽입 공격                    │
# │ Referrer-Policy            │ Referer 헤더 정보 유출                    │
# │ Permissions-Policy         │ 브라우저 기능 제한 (카메라, 위치 등)      │
# │ Strict-Transport-Security  │ HTTP 다운그레이드 공격                    │
# └────────────────────────────┴───────────────────────────────────────────┘
#
# ── CORS: Nginx vs Spring Security 비교 ──
#
# ┌──────────────────┬───────────────────────────┬───────────────────────────┐
# │ 항목             │ Nginx에서 처리            │ Spring Security에서 처리  │
# ├──────────────────┼───────────────────────────┼───────────────────────────┤
# │ 설정 위치        │ nginx.conf                │ CorsConfigurationSource   │
# │ 적용 범위        │ 모든 백엔드 공통          │ Spring 앱 한정            │
# │ Preflight 처리   │ Nginx에서 즉시 응답       │ Spring Filter 통과 필요   │
# │ 유연성           │ 단순 (정적 설정)          │ 동적 (DB 기반 가능)       │
# │ 권장 사용        │ 단일 프론트엔드 Origin    │ 다중 Origin, 동적 설정    │
# │ 주의             │ Nginx+Spring 중복 설정 시 │ 헤더가 2번 추가될 수 있음 │
# │                  │ 하나만 선택할 것          │                           │
# └──────────────────┴───────────────────────────┴───────────────────────────┘
#
# ── Rate Limiting: Nginx vs Redis Lua Script 비교 ──
#
# ┌──────────────────┬───────────────────────────┬───────────────────────────┐
# │ 항목             │ Nginx limit_req           │ Redis Lua Script          │
# ├──────────────────┼───────────────────────────┼───────────────────────────┤
# │ 적용 레벨        │ 인프라 (Nginx)            │ 애플리케이션 (Spring)     │
# │ 동작 범위        │ 단일 Nginx 인스턴스       │ 전체 서버 (Redis 공유)    │
# │ 알고리즘         │ Leaky Bucket              │ 커스텀 (Sliding Window)   │
# │ 키 기준          │ IP, URI 등 Nginx 변수     │ 사용자 ID, API Key 등     │
# │ 초과 시 응답     │ 429 (Nginx 자체)          │ 429 (Spring 응답)         │
# │ 적합한 경우      │ DDoS/무차별 차단          │ 사용자별 API 할당량       │
# │ 설정 난이도      │ 간단 (2줄)                │ 보통 (Lua 스크립트)       │
# └──────────────────┴───────────────────────────┴───────────────────────────┘
#
# ========================================================================

# ================================================================
# [1] 보안 헤더
# ================================================================
#
# server 블록 또는 별도 include 파일에 추가.
# `always` 키워드: 에러 응답(4xx, 5xx)에도 헤더를 포함.

server {
    listen 443 ssl;
    server_name example.com;

    # ────────────────────────────────────────────────────────────
    # [1-1] 기본 보안 헤더
    # ────────────────────────────────────────────────────────────

    # MIME 타입 스니핑 방지 — 브라우저가 Content-Type을 추측하지 않도록 강제
    add_header X-Content-Type-Options "nosniff" always;

    # 클릭재킹 방지 — iframe 삽입 금지 (CSP의 frame-ancestors가 대체)
    add_header X-Frame-Options "DENY" always;

    # XSS 필터 활성화 (레거시, 최신 브라우저는 CSP 사용)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referer 헤더 제한 — 외부 사이트로 전체 URL 유출 방지
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 브라우저 기능 제한 (카메라, 마이크, 위치 정보 등)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ────────────────────────────────────────────────────────────
    # [1-2] Content-Security-Policy (CSP)
    # ────────────────────────────────────────────────────────────
    #
    # XSS 공격의 가장 강력한 방어 수단.
    # 브라우저가 로드할 수 있는 리소스의 출처를 제한한다.
    #
    # ┌──────────────────┬────────────────────────────────────────┐
    # │ 디렉티브         │ 설명                                   │
    # ├──────────────────┼────────────────────────────────────────┤
    # │ default-src      │ 기본 정책 (다른 디렉티브 미설정 시)    │
    # │ script-src       │ JavaScript 소스 제한                  │
    # │ style-src        │ CSS 소스 제한                         │
    # │ img-src          │ 이미지 소스 제한                      │
    # │ connect-src      │ AJAX, WebSocket 연결 대상 제한        │
    # │ font-src         │ 폰트 소스 제한                        │
    # │ frame-ancestors  │ iframe 부모 제한 (X-Frame-Options 대체)│
    # └──────────────────┴────────────────────────────────────────┘

    # CSP 예시 — SPA + API 서버 구성
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.example.com; font-src 'self'; frame-ancestors 'none'" always;

    # ────────────────────────────────────────────────────────────
    # [1-3] 서버 정보 숨기기
    # ────────────────────────────────────────────────────────────

    # Server 헤더에서 Nginx 버전 숨김 (기본: nginx/1.x.x → nginx)
    server_tokens off;

    # Spring Boot의 X-Powered-By, Server 헤더도 숨길 것 (Spring Security에서 설정)

    # ================================================================
    # [2] CORS 설정 (Nginx에서 처리하는 경우)
    # ================================================================
    #
    # 주의: Spring Security에서 CORS를 처리한다면 Nginx에서는 설정하지 않을 것.
    # 양쪽에서 동시에 설정하면 Access-Control 헤더가 중복되어 브라우저가 거부한다.
    #
    # ┌──────────────────────────────────────────────────────────────┐
    # │  CORS Preflight 흐름                                        │
    # │                                                              │
    # │  브라우저 → OPTIONS /api/data (Preflight 요청)               │
    # │    ├─ Origin: https://frontend.example.com                  │
    # │    ├─ Access-Control-Request-Method: POST                   │
    # │    └─ Access-Control-Request-Headers: Content-Type          │
    # │                                                              │
    # │  Nginx 응답 (Preflight):                                    │
    # │    ├─ Access-Control-Allow-Origin: https://frontend...      │
    # │    ├─ Access-Control-Allow-Methods: GET, POST, ...          │
    # │    ├─ Access-Control-Allow-Headers: Content-Type, ...       │
    # │    ├─ Access-Control-Max-Age: 86400                         │
    # │    └─ 204 No Content                                        │
    # │                                                              │
    # │  브라우저 → POST /api/data (실제 요청)                      │
    # └──────────────────────────────────────────────────────────────┘

    location /api/ {
        # 허용할 Origin (프론트엔드 도메인)
        set $cors_origin "";
        if ($http_origin = "https://frontend.example.com") {
            set $cors_origin $http_origin;
        }

        # Preflight 요청 처리 (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  $cors_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        # 실제 요청에도 CORS 헤더 추가
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://spring_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ================================================================
# [3] Rate Limiting (요청 속도 제한)
# ================================================================
#
# ┌──────────────────────────────────────────────────────────────┐
# │  Leaky Bucket 알고리즘                                       │
# │                                                              │
# │  요청 유입 ──→ [  버킷 (burst)  ] ──→ 처리 (rate)            │
# │                                                              │
# │  rate=10r/s, burst=20:                                       │
# │  - 초당 10개 요청 처리 (일정한 속도)                         │
# │  - 순간적으로 20개까지 버킷에 대기 가능                      │
# │  - 버킷 초과 시 즉시 429 응답                                │
# │                                                              │
# │  nodelay 옵션:                                               │
# │  - burst 내 요청을 대기 없이 즉시 처리                       │
# │  - 버킷 소진 후 rate 속도로 복구                             │
# └──────────────────────────────────────────────────────────────┘

# limit_req_zone: http 블록에 정의 (server 블록 밖)
# $binary_remote_addr: 클라이언트 IP (binary = 메모리 효율)
# zone=api_limit:10m: 10MB 공유 메모리 (약 160,000 IP 저장)
# rate=10r/s: 초당 10개 요청

# http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # 429 응답 시 커스텀 에러 페이지
    # limit_req_status 429;  # 기본값 503 → 429로 변경 (Nginx 1.3.15+)
# }

server {
    listen 80;
    server_name rate-limit-example.com;

    # ────────────────────────────────────────────────────────────
    # [3-1] API 엔드포인트별 Rate Limiting
    # ────────────────────────────────────────────────────────────

    # 일반 API — 초당 10개, 순간 20개 허용 (nodelay)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://spring_app;
    }

    # 로그인 — 분당 5회 (무차별 대입 공격 방지)
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://spring_app;
    }

    # 전체 사이트 — 초당 30개 (DDoS 기본 방어)
    location / {
        limit_req zone=general_limit burst=50;

        proxy_pass http://spring_app;
    }
}

# ================================================================
# [4] Connection Limiting (동시 연결 수 제한)
# ================================================================

# http {
    # 동시 연결 수 제한 zone 정의
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
# }

server {
    listen 80;
    server_name conn-limit-example.com;

    # IP당 최대 동시 연결 수 50개
    limit_conn conn_limit 50;

    # 연결 초과 시 503 응답 (기본)
    # limit_conn_status 429;

    location / {
        proxy_pass http://spring_app;
    }
}

# ================================================================
# [5] IP 허용/차단 (allow / deny)
# ================================================================
#
# ┌──────────────────────────────────────────────────────────────┐
# │  평가 순서: 위에서 아래로 순차 평가, 첫 매칭에서 결정        │
# │                                                              │
# │  allow 10.0.0.0/24;    ← 사내 네트워크 허용                  │
# │  allow 192.168.1.100;  ← 특정 IP 허용                       │
# │  deny all;             ← 나머지 모두 차단 (403)              │
# └──────────────────────────────────────────────────────────────┘

server {
    listen 80;
    server_name admin-example.com;

    # 관리자 페이지 — 사내 IP만 접근 허용
    location /admin/ {
        allow 10.0.0.0/24;       # 사내 네트워크
        allow 192.168.1.0/24;    # VPN 대역
        deny all;                # 나머지 차단

        proxy_pass http://spring_app;
    }

    # Actuator 엔드포인트 — 모니터링 서버만 허용
    location /actuator/ {
        allow 10.0.10.50;        # Prometheus 서버
        allow 10.0.10.51;        # Grafana 서버
        deny all;

        proxy_pass http://spring_app;
    }

    # 일반 API — 모든 접근 허용
    location /api/ {
        proxy_pass http://spring_app;
    }
}
